name: Web UI QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - unify-web-desktop-ui

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

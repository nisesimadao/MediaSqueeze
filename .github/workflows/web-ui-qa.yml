name: Web UI QA

on:
  push:
    branches:
      - unify-web-desktop-ui

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npm run build

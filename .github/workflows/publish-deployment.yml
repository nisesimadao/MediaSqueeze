name: Publish deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: Production
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://mediasqueeze-web.vercel.app
    steps:
      - name: Verify production URL
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://mediasqueeze-web.vercel.app/ \
            -o /dev/null

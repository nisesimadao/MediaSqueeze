name: Build

on:
  push:
    branches:
      - main
      - support-all-media-formats
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (.NET 9 / WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore MediaSqueeze.sln
      - name: Build
        run: dotnet build MediaSqueeze.sln -c Release --no-restore

  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
